<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sugatai logo preview</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .row { display: flex; align-items: center; gap: 48px; padding: 40px 48px; }
      .paper { background: #fffaf5; }
      .ink { background: #161018; }
      .row img.word { height: 64px; }
      .row img.mark { height: 120px; }
      .label { font-size: 12px; color: #888; padding: 4px 48px; }
    </style>
  </head>
  <body>
    <p class="label">Wordmark + marks on paper</p>
    <div class="row paper">
      <img class="word" src="sugatai-wordmark.svg" alt="" />
      <img class="mark" src="sugatai-mark.svg" alt="" />
      <img class="mark" src="sugatai-mark-paper.svg" alt="" />
      <img class="mark" src="sugatai-mark-transparent.svg" alt="" />
    </div>
    <p class="label">Light wordmark + marks on ink</p>
    <div class="row ink">
      <img class="word" src="sugatai-wordmark-light.svg" alt="" />
      <img class="mark" src="sugatai-mark.svg" alt="" />
      <img class="mark" src="sugatai-mark-paper.svg" alt="" />
    </div>
    <p class="label">Small sizes (favicon scale 16 / 32 / 48)</p>
    <div class="row paper">
      <img src="sugatai-mark.svg" width="16" height="16" alt="" />
      <img src="sugatai-mark.svg" width="32" height="32" alt="" />
      <img src="sugatai-mark.svg" width="48" height="48" alt="" />
    </div>
  </body>
</html>
