name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: drapeai
          POSTGRES_PASSWORD: drapeai
          POSTGRES_DB: drapeai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drapeai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://drapeai:drapeai@localhost:5432/drapeai
      ENVIRONMENT: test
      NVIDIA_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Initialize database
        run: PGPASSWORD=drapeai psql -h localhost -U drapeai -d drapeai -f api/db/init.sql

      - name: Run migrations
        run: |
          for f in api/db/migrations/*.sql; do
            echo "Running migration: $f"
            PGPASSWORD=drapeai psql -h localhost -U drapeai -d drapeai -f "$f"
          done

      - name: Run tests
        working-directory: api
        run: pytest -v --tb=short

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze code
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: app
        run: flutter test || echo "No tests found (yet)"

      - name: Build check (APK debug)
        working-directory: app
        run: flutter build apk --debug

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        working-directory: api
        run: docker build -t drapeai-api:test .

      - name: Verify image
        run: docker run --rm drapeai-api:test python -c "import app; print('OK')"
