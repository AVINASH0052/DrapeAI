name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'infra/**'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/drapeai
            git pull origin main

            # Run migrations (Alembic tracks applied state)
            docker compose -f infra/docker-compose.prod.yml run --rm api \
              alembic upgrade head

            # Rebuild and restart (API + worker)
            docker compose -f infra/docker-compose.prod.yml build api
            docker compose -f infra/docker-compose.prod.yml up -d api worker redis

            # Verify health
            sleep 10
            curl -sf http://localhost:8000/health || exit 1
            echo "Deploy successful!"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed! Check server logs."
