# Redis configuration for DrapeAI
# Self-hosted, zero cost

# Persistence: AOF (append-only file) — crash-safe
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Disable RDB snapshots (AOF is enough)
save ""

# Memory management
maxmemory 200mb
maxmemory-policy allkeys-lru

# Security: bind to internal Docker network only
bind 0.0.0.0
protected-mode no

# Logging
loglevel notice
