events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:8000;
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name api.drapeai.app;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.drapeai.app;

        ssl_certificate     /etc/letsencrypt/live/api.drapeai.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.drapeai.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Upload limit (images up to 10 MB)
        client_max_body_size 11m;

        location / {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts for slow AI calls (bg removal + GPT-4o)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }
    }
}
